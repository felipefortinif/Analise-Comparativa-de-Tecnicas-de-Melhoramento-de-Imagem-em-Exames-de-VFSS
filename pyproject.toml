[project]
name = "vfss"
version = "0.1.0"
description = "Análise comparativa de técnicas de melhoramento de imagem em exames de videofluoroscopia da deglutição"
readme = "README.md"
authors = [{ name = "Felipe Fortini" }]
requires-python = ">=3.11,<3.12"
dependencies = [
    "hydra-core>=1.3.2",
    "mlflow>=2.17",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pandas>=2.2",
    "pydicom>=3.0",
]

[project.optional-dependencies]
# Instalado a partir da Fase 1 (rede de referência): uv sync --extra dl
dl = ["torch>=2.5", "torchvision>=0.20"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vfss"]

[tool.uv]
# O lockfile cobre Windows (máquina local) e Linux (eventual servidor/cluster).
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
